services:
  - type: web
    name: greenpulse-backend
    env: node
    region: singapore
    plan: free
    rootDir: backend
    buildCommand: pnpm install
    startCommand: node src/server.js
    envVars:
      - key: PORT
        value: 10000
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: ADMIN_EMAIL
        value: admin@allenlifecare.com
      - key: ADMIN_PASSWORD
        value: Admin@123
